baseURL: "https://gautsch.org/"
locale: "en-US"
title: "gautsch.org"
theme: "PaperMod"
params:
  ShowFullTextinRSS: "true"
  # PaperMod's own footer is replaced by layouts/_partials/extend_footer.html,
  # which renders outside this guard. Turning it off here avoids forking the
  # theme's footer template (and the scripts that live in it).
  hideFooter: true
  mainSections:
    - writing
    - posts
  assets:
    favicon: "/favicon.svg"
menu:
  main:
    - identifier: writing
      name: Writing
      url: /writing/
      weight: 10
    - identifier: archive
      name: Archive
      url: /archive/
      weight: 20
markup:
  goldmark:
    renderer:
      unsafe: true
