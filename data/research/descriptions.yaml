# Search and share descriptions for the 18 rabbit holes (Basecamp to-do 10306571780).
# Kept here, not in content/research/*/index.md, because scripts/import_research.py
# rewrites that front matter; the importer copies these in as `description:`.
# Aim for 120–160 characters, distinct per page, summarising rather than quoting.
acemoglu-and-restrepo-the-task-framework: "Acemoglu and Restrepo split technology into automation, which displaces workers, and new tasks, which reinstate them. The mix decides what workers get."
ai-growth-forecasts-whose-timeline: "Why Acemoglu's, Cowen's and Goldman's AI growth numbers can't be ranked: they measure different things over different horizons."
automation-and-the-labor-share: "Acemoglu's claim isn't mass unemployment. Automation moves displaced workers into lower-paid work and shrinks labor's share of income."
education-quality-and-economic-performance-the-outliers: "Test scores, not years of schooling, track economic growth. Which countries sit off the line, and why the candidates here are illustrations rather than a measured result."
hayek-and-decentralization: "Hayek on dispersed knowledge and prices, and why Acemoglu uses him to argue that large language models centralize what free societies spread out."
henry-sidgwick: "Who Henry Sidgwick was, and why Cowen offers his utilitarian answer to the value clashes Acemoglu declines to settle."
induced-innovation-and-the-habakkuk-thesis: "Habakkuk's 1962 thesis that scarce American labor spurred labor-saving invention, and why it grounds Acemoglu's view of falling birth rates."
john-rawls: "John Rawls and the veil of ignorance, and Acemoglu's objection: a philosopher's hypothetical agreement standing in for real people's consent."
king-and-plosser-real-business-cycles: "Who King and Plosser are, and why Cowen's real-business-cycle jab at Acemoglu, a left-leaning economist, lands."
nyc-vs-london-school-spending: "New York spends about $42,000 per student, roughly three to four times London. How much of that gap is accounting rather than classrooms."
pro-worker-ai: "Acemoglu's narrow definition of pro-worker AI, tools that expand what workers can do, and what he does and doesn't want regulators to decide."
rorty-objectivism-and-moral-progress: "Rorty's pragmatism versus moral realism, and why Acemoglu's talk of moral progress without an outside standard draws Cowen's challenge."
social-contract-theory-and-its-critics: "Social contract theory rests on agreement that never happened. Acemoglu says that settles whose values win before anyone is asked."
the-book-problem: "Acemoglu's \"book\" is a rulebook for settling clashes between values. What he objects to in Rawls and utilitarianism, and what he offers instead."
the-lucas-critique: "The Lucas critique says historical relationships break when conditions change, so Acemoglu's evidence from past labor shortages may not carry over."
the-printing-press-how-long-was-the-adjustment: "The printing press took 130 to 250 years to settle, and institutions did the settling. What that timeline suggests for social media."
the-straussian-view: "What a Straussian reading is, and why Cowen asks whether elite rule is fine as long as it stays out of view, and how Acemoglu answers."
working-class-liberalism-and-community-elbow-room: "What Acemoglu means by community elbow room: a floor of individual rights with real local authority above it, grounded in federalism."
