<title>Math Jack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap">
<style>
/* One look on purpose: a card table. Felt, a wood rail, ivory cards, Murphy's ink on the backs. */
:root {
  color-scheme: dark;
  --felt: #1d5a44;
  --felt-lo: #133d2f;
  --felt-hi: #2a7258;
  --rail: #5b3b24;
  --rail-hi: #7a5233;
  --ivory: #fbf6ea;
  --ivory-lo: #ece3cf;
  --ink: #1c1915;
  --red: #c4372c;
  --gold: #f2b53e;
  --gold-lo: #c98c1c;
  --good: #8fe3b0;
  --bad: #ff9a8a;
  --text: #f4efe2;
  --muted: #b9cfc3;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --cw: clamp(54px, min(17vw, 12.5vh), 118px);
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--felt-lo);
  color: var(--text);
  font: 16px/1.4 var(--body);
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

#app {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  background:
    radial-gradient(ellipse 80% 60% at 50% 42%, var(--felt-hi), transparent 70%),
    radial-gradient(ellipse at 50% 50%, var(--felt), var(--felt-lo));
}

/* Top bar: the match score as chips, five to win. */
header {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  background: linear-gradient(var(--rail-hi), var(--rail));
  border-bottom: 3px solid #3e2716;
  box-shadow: 0 2px 10px rgba(0,0,0,.35);
}
header .brand { white-space: nowrap; font: 22px/1 var(--display); color: var(--gold); letter-spacing: .5px; margin-right: auto; }
.score { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
.chips { display: flex; gap: 3px; }
.chip { width: 14px; height: 14px; border-radius: 50%; border: 2px dashed rgba(255,255,255,.35); box-sizing: border-box; }
.chip.on { border: 3px dashed var(--ivory); background: var(--gold); }
.score.dealer .chip.on { background: var(--red); }
.iconbtn { background: rgba(0,0,0,.25); border: 0; border-radius: 8px; padding: 6px 10px; font-size: 14px; font-weight: 700; }
.iconbtn:hover { background: rgba(0,0,0,.4); }

/* The table. */
#table {
  display: grid; grid-template-rows: 1fr auto 1fr;
  align-items: center; justify-items: center;
  padding: 8px 16px; min-height: 0; position: relative;
}
.seat { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.seat-label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.total {
  min-width: 34px; padding: 2px 10px; border-radius: 999px;
  background: rgba(0,0,0,.35); color: var(--text);
  font: 20px/1.2 var(--display); letter-spacing: .5px; text-align: center;
  font-variant-numeric: tabular-nums;
}
.total.bust { background: var(--red); }
.total.twentyone { background: var(--gold); color: var(--ink); }
.hand { display: flex; justify-content: center; min-height: calc(var(--cw) * 1.4); }
.hand .card + .card { margin-left: 10px; }
.hand.many .card + .card { margin-left: calc(var(--cw) * -0.42); }

#msg {
  min-height: 1.3em; text-align: center; text-wrap: balance;
  font: clamp(22px, 4.2vw, 34px)/1.15 var(--display); letter-spacing: .5px;
  text-shadow: 0 2px 0 rgba(0,0,0,.3);
}
#msg.win { color: var(--gold); }
#msg.lose { color: var(--bad); }
#msg.pop { animation: pop .35s ease-out; }
@keyframes pop { from { transform: scale(.7); opacity: 0; } }

/* Cards. A flip box: face on the front, Murphy's drawing on the back. */
.card {
  width: var(--cw); height: calc(var(--cw) * 1.4);
  perspective: 600px; flex: none; position: relative;
  animation: deal .32s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes deal { from { transform: translate(40vw, -30vh) rotate(25deg); opacity: 0; } }
.card .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .45s ease; }
.card.down .inner { transform: rotateY(180deg); }
.face, .back {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: calc(var(--cw) * .09);
  box-shadow: 0 3px 8px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.15);
}
.face { background: var(--ivory); color: var(--ink); overflow: hidden; }
.card.red .face { color: var(--red); }
.back {
  transform: rotateY(180deg);
  background: var(--ivory);
  border: calc(var(--cw) * .05) solid var(--gold);
  box-sizing: border-box;
  display: grid; place-items: center; overflow: hidden;
}
.back img { width: 92%; height: 92%; object-fit: contain; }
.idx {
  position: absolute; top: 4%; left: 6%;
  display: flex; flex-direction: column; align-items: center; line-height: .95;
  font-weight: 700; font-size: calc(var(--cw) * .21);
}
.idx i { font-style: normal; font-size: .8em; }
.idx.br { top: auto; left: auto; bottom: 4%; right: 6%; transform: rotate(180deg); }
.pip { position: absolute; font-size: calc(var(--cw) * .2); line-height: 1; transform: translate(-50%, -50%); }
.pip.flip { transform: translate(-50%, -50%) rotate(180deg); }
.ace { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--cw) * .62); line-height: 1; }
.court {
  position: absolute; inset: 18% 20%;
  border: 2px solid currentColor; border-radius: 6px;
  display: grid; place-items: center; align-content: center;
  font-family: var(--display); line-height: .9;
}
.court b { font-size: calc(var(--cw) * .44); font-weight: 400; }
.court i { font-style: normal; font-size: calc(var(--cw) * .22); }
.tag {
  position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%);
  white-space: nowrap; padding: 1px 7px; border-radius: 999px;
  background: var(--gold); color: var(--ink);
  font: 700 12px/1.3 var(--body);
  box-shadow: 0 1px 3px rgba(0,0,0,.4);
}
.card.down .tag { display: none; }

/* The math panel: the sum, the answer box, the number pad. Hit and Stand wait behind it. */
#panel {
  background: linear-gradient(var(--rail), #452c1a);
  border-top: 3px solid var(--rail-hi);
  padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
  display: grid; justify-items: center; gap: 10px;
}
.qrow { display: flex; align-items: center; gap: 12px; font: clamp(30px, 6vw, 44px)/1 var(--display); letter-spacing: 1px; font-variant-numeric: tabular-nums; }
#ans {
  min-width: 2.2em; padding: 4px 10px; border-radius: 10px; text-align: center;
  background: var(--ivory); color: var(--ink);
  box-shadow: inset 0 2px 4px rgba(0,0,0,.25);
}
#ans.empty { color: var(--ivory-lo); }
#ans.good { background: var(--good); }
#ans.shake { animation: shake .35s; background: var(--bad); }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
#hint { min-height: 1.4em; color: var(--ivory-lo); text-align: center; font-size: 16px; text-wrap: balance; }
#hint b { color: var(--gold); }
.dots { display: inline-flex; gap: 4px; vertical-align: middle; margin-left: 4px; }
.dots span { width: 12px; height: 12px; border-radius: 50%; background: var(--gold); }
#pad { display: grid; grid-template-columns: repeat(6, minmax(0, 64px)); gap: 8px; width: 100%; max-width: 440px; justify-content: center; }
#pad button {
  height: 50px; border: 0; border-radius: 10px;
  background: var(--ivory); color: var(--ink);
  font: 24px/1 var(--display); box-shadow: 0 3px 0 var(--ivory-lo), 0 4px 6px rgba(0,0,0,.3);
}
#pad button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ivory-lo); }
#pad .go { background: var(--gold); box-shadow: 0 3px 0 var(--gold-lo), 0 4px 6px rgba(0,0,0,.3); }
#pad .del { background: var(--ivory-lo); }
.choices { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.big {
  min-width: 140px; padding: 14px 26px; border: 0; border-radius: 14px;
  font: 30px/1 var(--display); letter-spacing: 1px;
  background: var(--gold); color: var(--ink);
  box-shadow: 0 4px 0 var(--gold-lo), 0 6px 10px rgba(0,0,0,.35);
}
.big.alt { background: var(--ivory); box-shadow: 0 4px 0 var(--ivory-lo), 0 6px 10px rgba(0,0,0,.35); }
.big:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-lo); }
.big small { display: block; font: 700 12px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; opacity: .65; margin-top: 4px; }
.unlock { animation: pop .3s ease-out; }
.keys { font-size: 12px; color: var(--muted); letter-spacing: .04em; }

/* Wide screens: the panel moves to the right of the table. */
@media (min-width: 820px) and (min-aspect-ratio: 5/4) {
  #app { grid-template-columns: 1fr minmax(320px, 400px); grid-template-rows: auto 1fr; }
  header { grid-column: 1 / -1; }
  #panel { border-top: 0; border-left: 3px solid var(--rail-hi); align-content: center; padding: 20px; }
  :root { --cw: clamp(60px, min(10vw, 16vh), 128px); }
  #pad { grid-template-columns: repeat(3, 72px); }
  #pad button { height: 58px; }
}

/* Title and end screens sit over the table. */
.over {
  position: fixed; inset: 0; z-index: 10; overflow: auto;
  display: grid; place-items: center;
  padding: 24px 16px;
  background:
    radial-gradient(ellipse 70% 50% at 50% 30%, var(--felt-hi), transparent 70%),
    var(--felt-lo);
}
.over .wrap { width: 100%; max-width: 560px; display: grid; justify-items: center; gap: 18px; text-align: center; }
.fan { position: relative; width: calc(var(--fw) * 2.2); height: calc(var(--fw) * 1.6); --fw: clamp(80px, 22vw, 120px); }
.fan .card { --cw: var(--fw); position: absolute; left: 50%; top: 0; margin-left: calc(var(--fw) * -.5); animation: none; transform-origin: 50% 120%; }
@media (max-width: 520px) {
  header { gap: 8px; padding-inline: 12px; }
  header .brand { font-size: 18px; }
  .score { font-size: 11px; gap: 4px; }
  .chip { width: 10px; height: 10px; }
  .iconbtn { padding: 5px 7px; font-size: 12px; }
}
.logo { margin: 0; font: clamp(52px, 13vw, 88px)/.9 var(--display); color: var(--gold); letter-spacing: 1px; text-shadow: 0 4px 0 var(--gold-lo), 0 8px 18px rgba(0,0,0,.4); }
.lede { margin: 0; max-width: 34em; font-size: 18px; color: var(--text); text-wrap: balance; }
.modes { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.credit { font-size: 14px; color: var(--muted); }
.stats { display: grid; grid-template-columns: auto auto; gap: 4px 18px; font-size: 18px; text-align: left; font-variant-numeric: tabular-nums; }
.stats b { font-family: var(--display); font-weight: 400; color: var(--gold); text-align: right; font-size: 22px; }
.end-title { margin: 0; font: clamp(44px, 11vw, 72px)/.95 var(--display); color: var(--gold); }
.end-title.lose { color: var(--ivory); }

@media (prefers-reduced-motion: reduce) {
  .card, #msg.pop, .unlock, #ans.shake { animation: none !important; }
  .card .inner { transition: none; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">Math Jack</span>
    <div class="score you"><span>You</span><span class="chips" id="chipsYou"></span></div>
    <div class="score dealer"><span>Dealer</span><span class="chips" id="chipsDealer"></span></div>
    <button class="iconbtn" id="soundBtn" aria-label="Sound">Sound</button>
    <button class="iconbtn" id="menuBtn">Menu</button>
  </header>

  <main id="table">
    <section class="seat">
      <div class="seat-label">Dealer <span class="total" id="dTotal">?</span></div>
      <div class="hand" id="dHand"></div>
    </section>
    <div id="msg" aria-live="polite"></div>
    <section class="seat">
      <div class="hand" id="pHand"></div>
      <div class="seat-label">You <span class="total" id="pTotal">?</span></div>
    </section>
  </main>

  <section id="panel">
    <div id="askBox">
      <div class="qrow"><span id="q"></span><span id="ans" class="empty">?</span></div>
    </div>
    <div id="hint"></div>
    <div id="pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="del" class="del" aria-label="Delete">⌫</button><button data-k="0">0</button><button data-k="go" class="go" aria-label="Check">✓</button>
    </div>
    <div class="choices" id="choose" hidden>
      <button class="big" id="hitBtn">Hit<small>one more card</small></button>
      <button class="big alt" id="standBtn">Stand<small>keep what I have</small></button>
    </div>
    <div class="choices" id="next" hidden>
      <button class="big" id="nextBtn">Next hand</button>
    </div>
    <div class="keys" id="keys"></div>
  </section>
</div>

<div class="over" id="title">
  <div class="wrap">
    <div class="fan" id="fan"></div>
    <h1 class="logo">Math Jack</h1>
    <p class="lede">Add up your cards to unlock <b>Hit</b> and <b>Stand</b>. Get closer to 21 than the dealer without going over. First to 5 hands wins.</p>
    <div class="modes">
      <button class="big" id="murphyBtn">Murphy mode<small>shows the sum, ties go to you</small></button>
      <button class="big alt" id="melissaBtn">Melissa mode<small>just the cards</small></button>
    </div>
    <div class="credit">Card back drawn by Murphy</div>
  </div>
</div>

<div class="over" id="end" hidden>
  <div class="wrap">
    <h2 class="end-title" id="endTitle"></h2>
    <div class="total" id="endScore" style="font-size:28px;padding:4px 18px"></div>
    <div class="stats" id="endStats"></div>
    <div class="modes">
      <button class="big" id="againBtn">Play again</button>
      <button class="big alt" id="modeBtn">Change mode</button>
    </div>
  </div>
</div>

// ---- cards and totals ----
const value = (c) => c.r === 'A' ? 1 : 'JQK'.includes(c.r) ? 10 : Number(c.r);
const isRed = (c) => c.s === '♥' || c.s === '♦';

function acceptedAnswers(cards, newCard, prevBest, first) {
  const t = totals(cards);
  const ok = new Set([t.hard]);
  if (t.soft) ok.add(t.soft);
  const opts = (c) => c.r === 'A' ? [1, 11] : [value(c)];
  if (first) { for (const a of opts(cards[0])) for (const b of opts(cards[1])) ok.add(a + b); }

function tone(freq, dur = 0.12, type = 'triangle', when = 0, vol = 0.15) {

function cardEl(c, down) {
  const el = document.createElement('div');
  el.className = 'card' + (isRed(c) ? ' red' : '') + (down ? ' down' : '');
  let mid;
  if (c.r === 'A') mid = `<div class="ace">${c.s}</div>`;
  else if ('JQK'.includes(c.r)) mid = `<div class="court"><b>${c.r}</b><i>${c.s}</i></div>`;
  else mid = PIPS[c.r].map(([x, y]) => `<span class="pip${y > 50 ? ' flip' : ''}" style="left:${x}%;top:${y}%">${c.s}</span>`).join('');
  const idx = `<b>${c.r}</b><i>${c.s}</i>`;
  const tag = MODES[S.mode].tags && (c.r === 'A' || 'JQK'.includes(c.r)) ? `<span class="tag">${c.r === 'A' ? '1 or 11' : '= 10'}</span>` : '';

  if (S.deck.length < 15 && !S.rigged.length) { shuffle(); say('Shuffling'); await step(500); say(''); }
  S.player.push(draw()); addCard('p', S.player[0]); await step(320);
  S.dealer.push(draw()); addCard('d', S.dealer[0]); showDealerTotal(); await step(320);
  S.player.push(draw()); addCard('p', S.player[1]); await step(320);
  S.dealer.push(draw()); addCard('d', S.dealer[1], true); await step(380);
  startAsk(true);
}

function startAsk(first) {
  const last = S.player[S.player.length - 1];
  S.accepted = acceptedAnswers(S.player, last, S.prevBest, first);
  if (first) {
    const [a, b] = S.player;
    S.sumText = `${label(a)} + ${label(b)} =`;
    const va = value(a), vb = value(b);   // count on from the bigger card, Ace as 1
    S.countFrom = Math.max(va, vb); S.countUp = Math.min(va, vb);
  } else {
    S.sumText = `${S.prevBest} + ${label(last)} =`;
    S.countFrom = S.prevBest; S.countUp = value(last);
  }
  S.answer = ''; S.wrong = 0; S.stats.asks++;
  $('#q').textContent = MODES[S.mode].showSum ? S.sumText : 'Your total =';
  setTotal('#pTotal', '?');
  const hasAce = S.player.some((c) => c.r === 'A');
  $('#hint').innerHTML = hasAce && MODES[S.mode].showSum ? 'An <b>A</b> counts as 1 or 11. Either answer works.' : '';
  renderAnswer();
  panel('ask');
  S.phase = 'ask';
  say(first ? 'Add up your cards' : 'Add the new card');
}

function giveHint() {
  const m = MODES[S.mode];
  if (S.wrong < m.hintAfter) { $('#hint').innerHTML = 'Not quite. Try again.'; return; }
  if (!m.showSum) { $('#q').textContent = S.sumText; $('#hint').innerHTML = 'Here is the sum. Try again.'; return; }
  // Murphy mode: count on from the bigger number, one dot per step.
  const dots = S.countUp <= 11 ? `<span class="dots">${'<span></span>'.repeat(S.countUp)}</span>` : '';
  const seq = S.wrong >= m.hintAfter + 1 && S.countUp <= 11
    ? ': ' + Array.from({ length: S.countUp }, (_, i) => i === S.countUp - 1 ? '<b>?</b>' : S.countFrom + i + 1).join(', ')
    : '';
  $('#hint').innerHTML = `Start at <b>${S.countFrom}</b> and count up <b>${S.countUp}</b>${dots}${seq}`;
}

function typeKey(k) {
  if (S.phase !== 'ask') return;
  if (k === 'del') S.answer = S.answer.slice(0, -1);
  else if (k === 'go') return submit();
  else if (S.answer.length < 2) S.answer = (S.answer === '0' ? '' : S.answer) + k;
  renderAnswer();
}

function submit() {
  if (S.phase !== 'ask' || !S.answer) return;
  const n = Number(S.answer);
  if (S.accepted.has(n)) return go(() => correct(n));
  S.wrong++; S.stats.wrong++;
  sfx.bad(); renderAnswer('shake');
  S.answer = '';
  giveHint();
  setTimeout(() => { if (S.phase === 'ask') renderAnswer(); }, 380);
}

async function correct(n) {
  S.phase = 'busy';
  if (S.wrong === 0) S.stats.first++;
  sfx.good(); renderAnswer('good');
  const t = totals(S.player);
  S.prevBest = t.best;
  showPlayerTotal();
  if (n > 21 && t.best <= 21) say(`${n} is right! Over 21, so the A counts as 1: ${t.best}`, 'win');
  else if (n !== t.best && t.best <= 21) say(`Yes! ${n} or ${t.best}. You have ${t.best}.`, 'win');
  else if (t.best > 21) say(`${t.best}. Bust!`, 'lose');
  else say(`Yes! ${t.best}`, 'win');
  await step(n > 21 && t.best <= 21 ? 1400 : 700);
  if (t.best > 21) return finish('dealer', `Bust at ${t.best}. Dealer wins this one.`);
  if (natural(S.player)) { say('Math Jack! 21 with two cards!', 'win'); await step(900); return dealerTurn(); }
  if (t.best === 21) { say('21! You stand.', 'win'); await step(700); return dealerTurn(); }
  S.phase = 'choose'; panel('choose'); say('Hit or stand?');
}

async function hit() {
  if (S.phase !== 'choose') return;
  S.phase = 'busy'; panel('none'); say('');
  const c = draw(); S.player.push(c); addCard('p', c);
  await step(380);
  startAsk(false);
}

async function dealerTurn() {
  S.phase = 'busy'; panel('none');
  S.holeDown = false;
  $('#dHand').lastElementChild.classList.remove('down');
  sfx.card(); showDealerTotal(); say('Dealer flips');
  await step(800);
  const pNat = natural(S.player), dNat = natural(S.dealer);
  if (pNat || dNat) {
    if (pNat && dNat) return MODES[S.mode].tiesWin ? finish('you', 'Both have Math Jack. Ties go to you!') : finish(null, 'Both have Math Jack. Tie!');
    if (pNat) { S.stats.mathjacks++; return finish('you', 'Math Jack! You win this one.'); }
    return finish('dealer', 'Dealer has 21 with two cards. Dealer wins.');
  }
  while (totals(S.dealer).best < MODES[S.mode].dealerStands) {
    say(`Dealer has ${totals(S.dealer).best}, takes a card`);
    await step(650);
    const c = draw(); S.dealer.push(c); addCard('d', c); showDealerTotal();
    await step(650);
  }
  const p = totals(S.player).best, d = totals(S.dealer).best;
  if (d > 21) return finish('you', `Dealer busts at ${d}. You win!`);
  if (p > d) return finish('you', `${p} beats ${d}. You win!`);
  if (d > p) return finish('dealer', `${d} beats ${p}. Dealer wins.`);
  if (MODES[S.mode].tiesWin) return finish('you', `${p} and ${d}. Ties go to you!`);
  return finish(null, `${p} and ${d}. Tie, nobody scores.`);
}

async function finish(winner, text) {
  S.phase = 'busy'; S.stats.hands++;
  if (S.holeDown) { S.holeDown = false; $('#dHand').lastElementChild?.classList.remove('down'); showDealerTotal(); }
  if (winner) S.score[winner]++;
  renderChips();
  say(text, winner === 'you' ? 'win' : winner === 'dealer' ? 'lose' : '');
  (winner === 'you' ? sfx.win : winner === 'dealer' ? sfx.lose : sfx.card)();
  if (S.score.you >= TO_WIN || S.score.dealer >= TO_WIN) { await step(1600); return showEnd(); }
  S.phase = 'next'; panel('next');
}

// ---- screens ----
function startMatch(mode) {
  S.run++; S.mode = mode; S.screen = 'play';
  S.score = { you: 0, dealer: 0 };
  S.stats = { asks: 0, first: 0, wrong: 0, hands: 0, mathjacks: 0 };
  S.prevBest = 0;
  if (!S.rigged.length) shuffle();
  renderChips();
  $('#title').hidden = true; $('#end').hidden = true;
  go(newHand);
}
function showTitle() {
  S.run++; S.screen = 'title'; S.phase = 'idle';
  $('#end').hidden = true; $('#title').hidden = false;
  $('#murphyBtn').focus({ preventScroll: true });
}
function showEnd() {
  S.screen = 'end'; S.phase = 'idle';
  const won = S.score.you > S.score.dealer;
  $('#endTitle').textContent = won ? 'You win!' : 'Dealer wins';
  $('#endTitle').className = 'end-title' + (won ? '' : ' lose');
  $('#endScore').textContent = `${S.score.you} to ${S.score.dealer}`;
  $('#endStats').innerHTML = [
    ['Sums answered', S.stats.asks],
    ['Right the first time', S.stats.first],
    ['Math Jacks', S.stats.mathjacks],
  ].map(([k, v]) => `<span>${k}</span><b>${v}</b>`).join('');
  $('#end').hidden = false;
  $('#againBtn').focus({ preventScroll: true });
}

// Title fan: an Ace and a Jack (Math Jack) in front of Murphy's card back.
function drawFan() {
  const fan = $('#fan');
  [[{ r: 'A', s: '♠' }, false, -20, -42], [{ r: 'J', s: '♥' }, false, 20, 42], [{ r: 'K', s: '♣' }, true, 0, 0]].forEach(([c, down, deg, dx]) => {
    const el = cardEl(c, down); el.querySelector('.tag')?.remove();
    el.style.transform = `translateX(${dx}%) rotate(${deg}deg)`; fan.appendChild(el);
  });
}

// ---- input ----
document.querySelectorAll('#pad button').forEach((b) => b.addEventListener('click', () => typeKey(b.dataset.k)));
$('#hitBtn').onclick = () => go(hit);
$('#standBtn').onclick = () => { if (S.phase === 'choose') go(dealerTurn); };
$('#nextBtn').onclick = () => { if (S.phase === 'next') go(newHand); };
$('#murphyBtn').onclick = () => startMatch('murphy');
$('#melissaBtn').onclick = () => startMatch('melissa');
$('#againBtn').onclick = () => startMatch(S.mode);
$('#modeBtn').onclick = showTitle;
$('#menuBtn').onclick = showTitle;
$('#soundBtn').onclick = () => { S.sound = !S.sound; $('#soundBtn').textContent = S.sound ? 'Sound' : 'Muted'; $('#soundBtn').setAttribute('aria-label', $('#soundBtn').textContent); };

addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (S.screen !== 'play') return;   // title and end screens use their focused buttons
  if (k === 'Escape') { showTitle(); return; }
  if (S.phase === 'ask') {
    if (/^[0-9]$/.test(k) && !e.repeat) { typeKey(k); e.preventDefault(); }
    else if (k === 'Backspace') { typeKey('del'); e.preventDefault(); }
    else if (k === 'Enter' && !e.repeat) { typeKey('go'); e.preventDefault(); }
  } else if (S.phase === 'choose' && !e.repeat) {
    if (k === 'h' || k === 'H') { go(hit); e.preventDefault(); }
    else if (k === 's' || k === 'S') { go(dealerTurn); e.preventDefault(); }
  } else if (S.phase === 'next' && !e.repeat && (k === 'Enter' || k === ' ')) { go(newHand); e.preventDefault(); }
});

drawFan(); renderChips(); panel('none'); $('#murphyBtn').focus({ preventScroll: true });

// Test hooks for test/bot.js.
window.__mj = {
  S, totals, acceptedAnswers,
  rig: (codes) => { S.rigged = codes.map((x) => ({ r: x.slice(0, -1), s: x.slice(-1) })); },
};
})();
</script>
