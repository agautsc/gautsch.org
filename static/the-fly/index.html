<style>
/* Layout: one comic panel fills the screen. Controls and cards float over it, like stickers on the page. */
:root {
  --paper: #fbf1c4;      /* the comic's page */
  --ink: #1c1e28;        /* his pen */
  --fly: #9bc24e;        /* the fly */
  --eye: #e3402f;        /* his cross-hatched eyes, and the apples */
  --swat: #ff5d8f;       /* swatters and warnings */
  --sky: #5cc3f2;        /* the way out */
  --hand: 'Patrick Hand', 'Comic Sans MS', 'Chalkboard SE', cursive;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--hand); font-size: 18px;
  overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
#stage { position: relative; height: 100%; }
#game { display: block; width: 100%; height: 100%; cursor: crosshair; }
button {
  font: inherit; color: var(--ink); background: var(--paper); border: 3px solid var(--ink);
  border-radius: 14px 18px 12px 20px; padding: 6px 14px; cursor: pointer; box-shadow: 3px 4px 0 var(--ink);
}
button:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--ink); }
button:focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; }
button[aria-pressed="true"] { background: var(--fly); }
#tools { position: absolute; top: 10px; right: 0; display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
#tools button { display: flex; align-items: center; gap: 6px; padding: 4px 12px; font-size: 17px; }
#bEye canvas { width: 30px; height: 32px; }
#card {
  position: absolute; left: 50%; bottom: 5%; transform: translateX(-50%) rotate(-1deg);
  width: min(560px, 100%); box-sizing: border-box; text-align: center;
  background: var(--paper); border: 4px solid var(--ink); border-radius: 18px 26px 16px 28px;
  padding: 12px 18px 18px; box-shadow: 6px 7px 0 var(--ink);
  display: flex; flex-direction: column; gap: 10px; align-items: center;
}
#card h2 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 400; text-wrap: balance; }
#card p { margin: 0; font-size: 20px; line-height: 1.25; max-width: 44ch; }
#card .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
#card .row button { font-size: 24px; padding: 8px 20px; display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
#card .row button small { font-size: 15px; opacity: .8; }
#card .row button.go { background: var(--sky); }
#turn { display: none; }
@media (orientation: portrait) and (max-width: 600px) { #turn { display: block; font-size: 16px; } }
@media (max-width: 600px) { #tools button span { display: none; } #card h2 { font-size: 26px; } #card p { font-size: 17px; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="The Fly: steer the fly away from the swatters"></canvas>
  <div id="tools">
    <button id="bEye" aria-pressed="false" title="Fly's eye view (E)"><canvas width="60" height="64"></canvas><span>Fly's eye</span></button>
    <button id="bSound" aria-pressed="true" title="Sound (M)"><span style="display:inline">Sound</span></button>
    <button id="bPause" title="Pause (P)" hidden><span style="display:inline">Pause</span></button>
  </div>
  <div id="card">
    <h2 id="cTitle"></h2>
    <p id="cText"></p>
    <div class="row" id="cRow"></div>
    <p id="turn">Turn your phone sideways for a bigger room.</p>
  </div>
</div>

    for (const s of S.sweeps) if (s.state === 'go') {
      const im = SP.swatB, w = 600, h = w * im.height / im.width;
      g.save(); g.translate(s.x, s.y); g.scale(s.dir, 1); g.rotate(0.27); g.drawImage(im, -w * 0.93, -h * 0.3, w, h); g.restore();
    }
  }
  for (const b of S.bits) { g.globalAlpha = 1 - b.t / b.life; g.fillStyle = b.col; g.strokeStyle = C.ink; g.lineWidth = 2.5; g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.fill(); g.stroke(); }
  g.globalAlpha = 1;
  for (const n of S.notes) {
    const im = SP[n.sprite], k = Math.min(1, n.t * 7), w = n.w * (0.5 + 0.5 * k), h = w * im.height / im.width;
    g.save(); g.globalAlpha = n.t > 1.1 ? (1.5 - n.t) / 0.4 : 1; g.translate(n.x, n.y); g.rotate(-0.08);
    g.fillStyle = C.paper; g.strokeStyle = C.ink; g.lineWidth = 4; wob(g, box(-w / 2 - 12, -h / 2 - 8, w + 24, h + 16), 80, true, 2); g.fill(); g.stroke();
    g.drawImage(im, -w / 2, -h / 2, w, h); g.restore();
  }
  if (S.screen === 'won') { const h = 520, w = h * SP.stand.width / SP.stand.height; g.fillStyle = 'rgba(251,241,196,.6)'; g.fillRect(0, 0, W, H); g.drawImage(SP.stand, 250 - w / 2, 60 + Math.sin(t * 4) * 8, w, h); drawWindow(g, t); }
  if (S.screen === 'over') { const w = 470, h = w * SP.angry.height / SP.angry.width; g.fillStyle = 'rgba(251,241,196,.6)'; g.fillRect(0, 0, W, H); g.drawImage(SP.angry, W / 2 - w / 2, 30, w, h); }
  g.restore();
}

function drawHud(g) {
  if (S.screen === 'title' || S.screen === 'load') return;
  g.save(); g.lineJoin = 'round';
  g.fillStyle = C.paper; g.strokeStyle = C.ink; g.lineWidth = 4;
  wob(g, box(22, 20, 392, 58), 90, true, 1.5); g.fill(); g.stroke();
  g.fillStyle = C.ink; g.font = `34px ${HAND}`; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText('Room ' + S.level, 38, 50);
  const total = MODES[S.mode].lives;
  for (let i = 0; i < total; i++) { g.globalAlpha = i < S.lives ? 1 : 0.2; g.drawImage(SP.fly, 150 + i * 40, 28, 44, 44 * SP.fly.height / SP.fly.width); }
  g.globalAlpha = 1;
  const ax = 150 + total * 40 + 14;
  g.drawImage(SP.apple, ax, 28, 40, 40 * SP.apple.height / SP.apple.width);
  g.fillText(S.open ? 'Go!' : `${S.eaten}/${S.need}`, ax + 46, 50);
  if (S.turbo > 0) { g.fillStyle = C.sky; g.fillRect(26, 84, 384 * S.turbo / 6, 8); g.strokeRect(26, 84, 384, 8); }
  g.restore();
}

// ---------- the fly's eye ----------
const R = 62, HEX = new Path2D(), FACETS = [];
for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3; HEX[i ? 'lineTo' : 'moveTo'](Math.cos(a) * (R + 0.6), Math.sin(a) * (R + 0.6)); }
HEX.closePath();
for (let r = 0, y = 0; y < H + R; r++, y = r * R * 1.5) for (let x = (r % 2) * R * 0.866; x < W + R; x += R * 1.732) FACETS.push({ x, y });
let view = { s: 1, ox: 0, oy: 0 }, lens = null;
function buildLens() {
  // the shine and the dark seams of each facet, drawn once
  lens = mk(cv.width, cv.height); const g = lens.getContext('2d');
  g.setTransform(view.s, 0, 0, view.s, view.ox, view.oy); g.beginPath(); g.rect(0, 0, W, H); g.clip();
  for (const f of FACETS) {
    g.save(); g.translate(f.x, f.y);
    const hue = (f.x * 0.22 + f.y * 0.45) % 360, gr = g.createRadialGradient(-R * 0.3, -R * 0.36, R * 0.05, 0, 0, R);
    gr.addColorStop(0, `hsla(${hue},95%,88%,.42)`); gr.addColorStop(0.45, `hsla(${hue + 70},90%,60%,.08)`); gr.addColorStop(1, `hsla(${hue + 150},85%,32%,.38)`);
    g.fillStyle = gr; g.fill(HEX); g.lineWidth = 4.5; g.strokeStyle = 'rgba(28,30,40,.92)'; g.stroke(HEX);
    g.restore();
  }
}
function drawEye() {
  // each facet sees a little more than its own patch of the room, so everything repeats around its edges
  const Z = 0.56, sw = 2 * R / Z;
  cx.save(); cx.setTransform(view.s, 0, 0, view.s, view.ox, view.oy); cx.beginPath(); cx.rect(0, 0, W, H); cx.clip();
  cx.fillStyle = C.ink; cx.fillRect(0, 0, W, H);
  for (const f of FACETS) {
    const x0 = Math.max(0, f.x - sw / 2), y0 = Math.max(0, f.y - sw / 2), x1 = Math.min(W, f.x + sw / 2), y1 = Math.min(H, f.y + sw / 2);
    if (x1 <= x0 || y1 <= y0) continue;
    cx.save(); cx.translate(f.x, f.y); cx.clip(HEX);
    cx.drawImage(sc, x0, y0, x1 - x0, y1 - y0, (x0 - f.x) * Z, (y0 - f.y) * Z, (x1 - x0) * Z, (y1 - y0) * Z);
    cx.restore();
  }
  cx.restore();
  if (!lens) buildLens();
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.drawImage(lens, 0, 0);
}

function resize() {
  const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(2, Math.round(r.width * dpr)); cv.height = Math.max(2, Math.round(r.height * dpr));
  const s = Math.min(cv.width / W, cv.height / H);
  view = { s, ox: (cv.width - W * s) / 2, oy: (cv.height - H * s) / 2, dpr }; lens = null;
}
function render(t) {
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.fillStyle = C.paper; cx.fillRect(0, 0, cv.width, cv.height);
  if (S.eye) { sg.setTransform(1, 0, 0, 1, 0, 0); drawScene(sg, t); drawEye(); }
  else { cx.save(); cx.setTransform(view.s, 0, 0, view.s, view.ox, view.oy); cx.beginPath(); cx.rect(0, 0, W, H); cx.clip(); drawScene(cx, t); cx.restore(); }
  cx.setTransform(view.s, 0, 0, view.s, view.ox, view.oy); drawHud(cx);
}

// ---------- sound ----------
let AC = null, buzz = null, buzzGain = null;
function audio() {
  if (AC || S.muted) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    buzz = AC.createOscillator(); buzz.type = 'sawtooth'; buzz.frequency.value = 170;
    const wobble = AC.createOscillator(), wg = AC.createGain(), lp = AC.createBiquadFilter();
    wobble.frequency.value = 33; wg.gain.value = 28; wobble.connect(wg); wg.connect(buzz.frequency);
    lp.type = 'lowpass'; lp.frequency.value = 800; buzzGain = AC.createGain(); buzzGain.gain.value = 0;
    buzz.connect(lp); lp.connect(buzzGain); buzzGain.connect(AC.destination); buzz.start(); wobble.start();
  } catch (e) { AC = null; }
}
function tone(f0, f1, dur, type, vol) {
  if (!AC || S.muted) return;
  const o = AC.createOscillator(), g = AC.createGain(), n = AC.currentTime;
  o.type = type || 'square'; o.frequency.setValueAtTime(f0, n); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), n + dur);
  g.gain.setValueAtTime(vol || 0.12, n); g.gain.exponentialRampToValueAtTime(0.001, n + dur);
  o.connect(g); g.connect(AC.destination); o.start(n); o.stop(n + dur + 0.02);
}
function hiss(dur, vol, freq) {
  if (!AC || S.muted) return;
  const b = AC.createBuffer(1, Math.ceil(AC.sampleRate * dur), AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol; s.buffer = b; s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
}
const sfx = {
  munch: () => tone(520, 380, 0.05, 'square', 0.05),
  eat: () => { tone(500, 900, 0.12, 'triangle', 0.16); setTimeout(() => tone(800, 1300, 0.12, 'triangle', 0.14), 90); },
  lock: () => tone(880, 660, 0.12, 'square', 0.06),
  swat: () => { hiss(0.22, 0.5, 1400); tone(140, 50, 0.18, 'sine', 0.3); },
  whoosh: () => hiss(0.5, 0.3, 2600),
  daaaa: () => tone(700, 180, 0.7, 'sawtooth', 0.14),
  open: () => [660, 880, 1100, 1320].forEach((f, i) => setTimeout(() => tone(f, f, 0.16, 'triangle', 0.14), i * 110)),
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => tone(f, f, 0.2, 'triangle', 0.15), i * 120)),
  over: () => [392, 330, 262, 196].forEach((f, i) => setTimeout(() => tone(f, f * 0.94, 0.3, 'sawtooth', 0.1), i * 220)),
  flip: () => { for (let i = 0; i < 4; i++) setTimeout(() => tone(900 + i * 150, 1400 + i * 150, 0.07, 'triangle', 0.12), i * 70); },
};

// ---------- cards and buttons ----------
const $ = (id) => document.getElementById(id);
function btn(label, small, fn, go) {
  const b = document.createElement('button'); b.textContent = label; if (go) b.className = 'go';
  if (small) { const s = document.createElement('small'); s.textContent = small; b.appendChild(s); }
  b.addEventListener('click', () => { audio(); fn(); }); return b;
}
function showCard() {
  const card = $('card'), row = $('cRow'); row.textContent = '';
  $('bPause').hidden = S.screen !== 'play';
  card.hidden = S.screen === 'play' || S.screen === 'load';
  if (S.screen === 'title') {
    $('cTitle').textContent = 'Get out of the kitchen';
    $('cText').textContent = 'Eat the apples and the window opens. Stay out from under the swatters. Drag a finger or the mouse, or use the arrow keys.';
    row.append(btn('Murphy rules', '3 lives', () => startGame('murphy'), true), btn('Melissa rules', '1 life, faster swatters', () => startGame('melissa')));
  } else if (S.screen === 'won') {
    $('cTitle').textContent = `Out of room ${S.level}!`;
    $('cText').textContent = 'The next kitchen has quicker swatters and more apples to eat.';
    row.append(btn('Next room', '', () => { S.level++; startLevel(); }, true));
  } else if (S.screen === 'over') {
    const best = Math.max(store.get('best-' + S.mode, 0), 0);
    $('cTitle').textContent = `Swatted in room ${S.level}`;
    $('cText').textContent = best ? `Most rooms escaped on ${MODES[S.mode].name} rules: ${best}.` : 'No rooms escaped yet. The pink shadow shows where a swatter will land.';
    row.append(btn('Try again', '', () => startGame(S.mode), true), btn('Cover', '', toTitle));
  } else if (S.screen === 'paused') {
    $('cTitle').textContent = 'Paused'; $('cText').textContent = '';
    row.append(btn('Keep flying', '', () => { S.screen = 'play'; showCard(); }, true), btn('Cover', '', toTitle));
  }
  const first = row.querySelector('button'); if (first && document.activeElement !== cv) first.focus({ preventScroll: true });
}
function toTitle() { S.screen = 'title'; S.level = 1; S.swats = []; S.sweeps = []; S.snacks = []; S.pow = null; S.splat = null; S.notes = []; S.bits = []; S.open = false; buildBg(1, true); showCard(); }
function pause() { if (S.screen === 'play') { S.screen = 'paused'; showCard(); } else if (S.screen === 'paused') { S.screen = 'play'; showCard(); } }
function setEye(on) { S.eye = on; store.set('eye', on); $('bEye').setAttribute('aria-pressed', String(on)); }
function setMuted(m) { S.muted = m; store.set('muted', m); $('bSound').setAttribute('aria-pressed', String(!m)); if (!m) audio(); }
$('bEye').addEventListener('click', () => setEye(!S.eye));
$('bSound').addEventListener('click', () => setMuted(!S.muted));
$('bPause').addEventListener('click', pause);

// ---------- steering ----------
function aim(e) {
  const r = cv.getBoundingClientRect(), d = view.dpr || 1;
  S.target = { x: ((e.clientX - r.left) * d - view.ox) / view.s, y: ((e.clientY - r.top) * d - view.oy) / view.s - (e.pointerType === 'touch' ? 70 : 0) };
}
cv.addEventListener('pointerdown', (e) => { audio(); if (S.screen === 'play') { aim(e); try { cv.setPointerCapture(e.pointerId); } catch (x) {} } });
cv.addEventListener('pointermove', (e) => { if (S.screen === 'play' && (e.pointerType === 'mouse' || e.buttons || e.pressure > 0)) aim(e); });
cv.addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse' && S.screen === 'play') S.target = null; });
const KEY = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'up', w: 'up', W: 'up', PageUp: 'up', ArrowDown: 'down', s: 'down', S: 'down', PageDown: 'down' };
addEventListener('keydown', (e) => {
  if (KEY[e.key]) { keys[KEY[e.key]] = true; audio(); if (S.screen === 'play') e.preventDefault(); return; }
  if (e.repeat) return;
  if (e.key === 'e' || e.key === 'E') setEye(!S.eye);
  else if (e.key === 'm' || e.key === 'M') setMuted(!S.muted);
  else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') pause();
  else if (S.screen === 'title' && (e.key === '1' || e.key === '2')) { audio(); startGame(e.key === '1' ? 'murphy' : 'melissa'); }
});
addEventListener('keyup', (e) => { if (KEY[e.key]) keys[KEY[e.key]] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (S.screen === 'play') pause(); });
addEventListener('resize', resize);

// ---------- go ----------
let last = 0, clock = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now; clock += dt;
  if (S.screen !== 'paused' && S.screen !== 'load') { step(dt / 2); step(dt / 2); }
  if (buzzGain) {
    const v = Math.hypot(S.fly.vx, S.fly.vy), on = S.screen === 'play' && S.dead <= 0 && !S.muted;
    buzzGain.gain.value = on ? 0.012 + Math.min(1, v / 600) * 0.03 : 0; buzz.frequency.value = 150 + v * 0.14 + (S.turbo > 0 ? 60 : 0);
  }
  render(clock);
  requestAnimationFrame(frame);
}
window.__fly = { S, W, H, WIN, MODES, startGame, startLevel, step, setEye, FACETS };
setEye(S.eye); setMuted(S.muted);
loadArt().then(() => { makeSprites(); resize(); toTitle(); requestAnimationFrame(frame); });
</script>
