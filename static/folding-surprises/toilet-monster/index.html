<style>
:root{
  --ground:#dcd8d0;
  --ink:#241f24;
  --muted:#5d5660;
  --paper:#f8f4ec;
  --btn:#241f24;
  --btn-ink:#f8f4ec;
  --shadow:0 1px 2px rgb(36 31 36 / .12),0 10px 30px rgb(36 31 36 / .16);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#1c1a1e; --ink:#f1ede6; --muted:#a8a1aa;
    --btn:#f1ede6; --btn-ink:#1c1a1e;
    --shadow:0 1px 2px rgb(0 0 0 / .4),0 12px 34px rgb(0 0 0 / .5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#1c1a1e; --ink:#f1ede6; --muted:#a8a1aa;
  --btn:#f1ede6; --btn-ink:#1c1a1e;
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 12px 34px rgb(0 0 0 / .5);
}
body{background:var(--ground);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:14px;padding-inline:16px;padding-block:18px 22px}
header{text-align:center;display:flex;flex-direction:column;gap:2px}
h1{margin:0;font:800 clamp(26px,5vw,38px)/1.05 "Baloo 2",system-ui,sans-serif;letter-spacing:.2px;text-wrap:balance}
.back{color:var(--muted);font-size:14px;text-decoration:none;margin-bottom:4px}
.back:hover,.back:focus-visible{color:var(--ink);text-decoration:underline}
.by{margin:0;color:var(--muted);font-size:14px}
.stage{position:relative;width:min(100%,560px);aspect-ratio:1630/1700;max-width:100%;
  background:var(--paper);border-radius:3px;box-shadow:var(--shadow);cursor:pointer}
canvas{display:block;width:100%;height:100%}
.hint{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);margin:0;padding:6px 12px;border-radius:999px;
  background:rgb(36 31 36 / .78);color:#f8f4ec;font-size:13px;pointer-events:none;transition:opacity .4s}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:600 15px/1 system-ui,sans-serif;padding:10px 18px;border-radius:999px;border:2px solid var(--btn);background:var(--btn);color:var(--btn-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
button:focus-visible{outline:3px solid #e8c32a;outline-offset:2px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:#5d5660;font-size:14px}
</style>

const META = {"armBlue": [138, 569, 408, 228], "armOrange": [246, 704, 300, 308], "armRainbow": [1060, 585, 290, 169], "armGreen": [1056, 746, 219, 199], "mouth": [578, 533, 506, 483], "tongue": [928, 922, 236, 344], "tpL": [1, 593, 170, 301], "roll": [106, 1005, 252, 264], "dropA": [403, 1034, 78, 64], "dropB": [372, 1093, 105, 138], "tpR": [1259, 750, 119, 144], "dot": [1284, 945, 54, 36], "dropR": [1170, 989, 79, 89], "poop": [1240, 1023, 159, 157], "slime01": [821, 981, 58, 45], "slime02": [775, 992, 51, 71], "slime03": [577, 1000, 41, 85], "slime04": [629, 1015, 40, 73], "slime05": [739, 1029, 49, 83], "slime06": [677, 1074, 45, 81], "slime07": [761, 1133, 46, 86], "slime08": [604, 1140, 24, 39], "slime09": [720, 1141, 45, 41], "slime11": [959, 1153, 57, 111], "slime12": [662, 1166, 21, 24], "slime14": [736, 1198, 37, 53], "slime16": [679, 1206, 22, 22], "slime17": [783, 1229, 17, 18], "pupilL": [699, 1490, 78, 79], "pupilR": [848, 1481, 74, 75], "static": [0, 0, 1408, 1630], "closed": [57, 29, 772, 967]};
// the toilet's own middle (x 775) sits at the centre of the canvas
const W = 1408, H = 1630, OX = 40, OY = 40, CW = 2 * (775 + OX), CH = H + OY + 30;
const F1 = 505, F2 = 1392, MID = F2 - F1;      // the paper's two folds
const LOOP = 17;

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const img = {};
let loaded = 0; const names = Object.keys(SPR);
let failed = 0;
const settle = ok => { if (!ok) failed++; if (++loaded === names.length) boot(); };
names.forEach(k => { const im = new Image(); im.onload = () => settle(true); im.onerror = () => settle(false); im.src = SPR[k]; img[k] = im; });

// --- easing helpers
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const seg = (t,a,b) => clamp((t - a) / (b - a));
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeIn = p => p * p * p;
const easeInOut = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;
const backOut = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const elastic = p => p === 0 ? 0 : p === 1 ? 1 : Math.pow(2, -9*p) * Math.sin((p*10 - .75) * 2.1) + 1;
const lerp = (a,b,p) => a + (b - a) * p;

const ready = k => img[k] && img[k].complete && img[k].naturalWidth > 0;
function draw(k, dx=0, dy=0) { if (!ready(k)) return; const m = META[k]; ctx.drawImage(img[k], m[0] + dx, m[1] + dy); }
function center(k) { const m = META[k]; return [m[0] + m[2]/2, m[1] + m[3]/2]; }

// pivots, in the drawing's own pixel space
const ARMS = [
  { k:'armBlue',    px:543,  py:680, amp:11, f:1.7, ph:0.0, lag:0.00 },
  { k:'armOrange',  px:540,  py:745, amp:13, f:2.1, ph:1.3, lag:0.12 },
  { k:'armRainbow', px:1058, py:690, amp:12, f:1.9, ph:2.2, lag:0.06 },
  { k:'armGreen',   px:1058, py:775, amp:14, f:1.5, ph:0.7, lag:0.18 },
];
const DEBRIS = ['tpL','roll','dropA','dropB','tpR','dot','dropR','poop'];
const SLIME = names.filter(k => k.startsWith('slime'));
const BOWL = [800, 1290];                        // where things fly out from

// --- timeline (seconds)
// 0 closed · 1.1 rattle · 2.2 hop · 2.6 unfold · 3.4 monster rises · 4.0 arms · 4.2 junk flies
// 13.2 everything dives back · 14.6 folds shut · 15.6 closed again
function frame(t) {
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0, 0, CW, CH);
  ctx.translate(CW, CH); ctx.rotate(Math.PI);    // shown turned 180°
  ctx.translate(OX, OY);
  const unfold = t < 8 ? easeInOut(seg(t, 2.55, 3.35)) : 1 - easeInOut(seg(t, 14.55, 15.25));
  const closedA = t < 8 ? 1 - seg(t, 2.42, 2.54) : seg(t, 15.2, 15.32);
  const openA = 1 - closedA;
  const dy = (1 - unfold) * MID / 2;             // keep the folded paper centred

  // rattle + hop on the closed toilet
  let shakeX = 0, shakeR = 0, hop = 0, squash = 0;
  if (t > 1.1 && t < 2.35) {
    const p = seg(t, 1.1, 2.3), a = 2 + 16 * p * p;
    shakeX = Math.sin(t * 55) * a * .7; shakeR = Math.sin(t * 43) * a * .0014;
  }
  if (t > 2.15 && t < 2.8) { const p = seg(t, 2.15, 2.8); hop = Math.sin(Math.PI * p) * 70; /* + is up on screen once turned */ squash = Math.sin(Math.PI * p * 2) * .06; }

  ctx.save();
  ctx.translate(W/2 + shakeX, H/2 + hop); ctx.rotate(shakeR); ctx.scale(1 - squash*.5, 1 + squash); ctx.translate(-W/2, -H/2);

  if (closedA > 0) {
    ctx.globalAlpha = closedA;
    const s = 0.81, m = META.closed;
    const cy = (38 + dy) + ((F1 - 38) + (1600 - F2)) / 2;     // folded drawing's middle
    ctx.save(); ctx.translate(775 - 325 * s, cy - m[3] * s / 2); ctx.scale(s, s);
    if (ready('closed')) ctx.drawImage(img.closed, 0, 0); ctx.restore();
    ctx.globalAlpha = 1;
  }

  if (openA > 0) {
    ctx.globalAlpha = openA;
    const live = t > 3.3 && t < 15;
    const tt = t - 3.3;

    // arms sit behind the toilet walls, so they go first
    if (live) ARMS.forEach(a => {
      const out = t < 8 ? elastic(seg(t, 3.95 + a.lag, 4.95 + a.lag)) : 1 - easeIn(seg(t, 13.25 + a.lag*.5, 13.85 + a.lag*.5));
      if (out <= 0.001) return;
      const wave = Math.sin(tt * a.f * 2 + a.ph) * a.amp + Math.sin(tt * a.f * 5.3 + a.ph) * a.amp * .25;
      ctx.save(); ctx.translate(a.px, a.py + dy);
      ctx.rotate((wave * clamp(out) + (1 - out) * (a.px < 800 ? -40 : 40)) * Math.PI / 180);
      const sc = .2 + .8 * out; ctx.scale(sc, sc);
      ctx.translate(-a.px, -a.py); draw(a.k); ctx.restore();
    });

    // the paper: top band, middle band (unfolding), bottom band
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, F1 + dy); ctx.clip(); ready('static') && ctx.drawImage(img.static, 0, dy); ctx.restore();
    if (unfold > 0.002) {
      ctx.save(); ctx.beginPath(); ctx.rect(0, F1 + dy, W, MID * unfold); ctx.clip();
      ctx.translate(0, F1 + dy); ctx.scale(1, unfold); ctx.translate(0, -F1);
      ready('static') && ctx.drawImage(img.static, 0, 0);
      ctx.restore();
    }
    const bdy = dy - (1 - unfold) * MID;
    ctx.save(); ctx.beginPath(); ctx.rect(0, F2 + bdy, W, H); ctx.clip(); ready('static') && ctx.drawImage(img.static, 0, bdy); ctx.restore();

    // eyes on the bowl look around
    const look = t < 3.3 ? 0 : Math.max(-1, Math.min(1, Math.sin(tt * 1.3) * 2.2)) * 9;
    const lookY = t < 3.3 ? 0 : Math.max(0, Math.sin(tt * 0.7 + 1)) * -5;
    draw('pupilL', look, bdy + lookY); draw('pupilR', look, bdy + lookY);

    if (live) {
      // slime bubbles up out of the bowl and wobbles
      SLIME.forEach((k, i) => {
        const [cx, cy] = center(k);
        const p = t < 8 ? backOut(seg(t, 3.6 + i * .04, 4.3 + i * .04)) : 1 - easeIn(seg(t, 13.1 + i * .02, 13.6 + i * .02));
        if (p <= 0.001) return;
        const wob = Math.sin(tt * 2.3 + i * 1.7) * 7, wobx = Math.sin(tt * 1.6 + i * 2.9) * 5;
        const x = lerp(BOWL[0] + (cx - 800) * .3, cx, p) + wobx, y = lerp(1300, cy, p) + wob + dy;
        ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(tt * 1.9 + i) * .15); ctx.scale(clamp(p, 0, 1.2), clamp(p, 0, 1.2));
        if (ready(k)) ctx.drawImage(img[k], -META[k][2]/2, -META[k][3]/2); ctx.restore();
      });

      // the monster: rises out of the bowl, chomps, bobs, wags its tongue
      const rise = t < 8 ? backOut(seg(t, 3.3, 4.2)) : 1 - easeIn(seg(t, 13.5, 14.3));
      if (rise > 0.001) {
      const rOff = (1 - rise) * 560;
      const bob = Math.sin(tt * 2.2) * 10;
      const chomp = Math.pow(Math.abs(Math.sin(tt * 2.6)), 3);
      const sway = Math.sin(tt * 1.1) * 2.2 * Math.PI / 180;
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, W, F2 + dy); ctx.clip();
      ctx.translate(820, 960 + dy + rOff + bob); ctx.rotate(sway);
      ctx.scale(1 + chomp * .035, 1 - chomp * .07); ctx.translate(-820, -960);
      ctx.save(); ctx.translate(975, 965); ctx.rotate((Math.sin(tt * 1.8) * 9 + Math.sin(tt * 4.1) * 3) * Math.PI / 180);
      ctx.translate(-975, -965); draw('tongue'); ctx.restore();
      draw('mouth');
      ctx.restore();
      // while it climbs in or out, the bowl's own teeth stay in front of it
      if (rise < 1) { ctx.save(); ctx.beginPath(); ctx.rect(0, 1236 + dy, W, F2 - 1236); ctx.clip(); ready('static') && ctx.drawImage(img.static, 0, dy); ctx.restore(); }
      }

      // toilet paper, drops and the poop get flung out, then float
      DEBRIS.forEach((k, i) => {
        const [hx, hy] = center(k);
        const launch = 4.15 + i * .13;
        const p = t < 8 ? easeOut(seg(t, launch, launch + .75)) : 1 - easeInOut(seg(t, 12.9 + i * .05, 13.5 + i * .05));
        if (p <= 0.001) return;
        const arc = Math.sin(Math.PI * p) * 260;
        const x = lerp(BOWL[0], hx, p) + Math.sin(tt * 1.4 + i * 2.1) * 10 * p;
        const y = lerp(BOWL[1], hy, p) - arc + Math.sin(tt * 1.9 + i * 1.3) * 12 * p + dy;
        const spin = (1 - p) * Math.PI * 2 * (i % 2 ? 1 : -1) + Math.sin(tt * 1.2 + i) * .16;
        const sc = .3 + .7 * p;
        ctx.save(); ctx.translate(x, y); ctx.rotate(spin); ctx.scale(sc, sc);
        if (ready(k)) ctx.drawImage(img[k], -META[k][2]/2, -META[k][3]/2); ctx.restore();
      });
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// --- playback
let t0 = null, clock = 0, playing = true, last = null;
const playBtn = document.getElementById('play'), hint = document.getElementById('hint');
function tick(now) {
  if (last !== null && playing) clock += Math.min(.05, (now - last) / 1000);
  last = now;
  frame(clock % LOOP);
  requestAnimationFrame(tick);
}
function setPlaying(v) { playing = v; playBtn.textContent = v ? 'Pause' : 'Play'; }
playBtn.onclick = () => setPlaying(!playing);
document.getElementById('again').onclick = () => { clock = 0; setPlaying(true); };
document.getElementById('stage').onclick = () => setPlaying(!playing);
function boot() {
  const L = document.getElementById('loading');
  if (failed === names.length) { L.textContent = "This browser couldn't open the drawing's pictures."; return; }
  L.remove();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { clock = 7.5; setPlaying(false); }
  hint.style.opacity = 1; setTimeout(() => hint.style.opacity = 0, 3500);
  requestAnimationFrame(tick);
}
</script>
